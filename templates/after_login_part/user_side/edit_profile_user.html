{% extends 'base.html' %}
{% block stylesheet %}
    <link rel="stylesheet" href="/static/css/after_login/user_side/edit_profile_user.css">
{% endblock %}

{% block title %}
    Edit Profile
{% endblock %}

{% block content %}
<header>
    <div class="heading-app">
        <h1>ParkoU</h1>
    </div>
</header>
<main>
    <div class="container">
        <form action="/user/edit/profile" method="POST" class="edit-profile-form">
            <div class="form-heading">
                <h3>Chenge your credentials</h3>
            </div>
            <div class="input-field">
                <div><i class="fas fa-user"></i></div>
                <input type="text" name="fullName" placeholder="Name" required/>
            </div>
            <div class="input-field">
                <div><i class="fas fa-envelope"></i></div>
                <input type="email" name="email" placeholder="Email" required/>
            </div>
            <div class="input-field">
                <div><i class="fas fa-lock"></i></div>
                <input type="password" name="password" placeholder="Password" required/>
            </div>
            <input id="submitbtn" type="submit" class="btn btn-info" value="Submit" />
            <a href="{{ url_for('user_dashboard') }}" class="btn btn-warning" id="backbtn">Go Back</a>
        </form>
    </div>
</main>
{% endblock %}
