{% extends 'base.html' %}
{% block stylesheet %}
    <link rel="stylesheet" href="/static/css/after_login/user_side/user_after_login.css">
{% endblock %}

{% block title %}
    City Option
{% endblock %}

{% block content %}
    <header>
        <div class="heading-app">
            <h1>ParkoU</h1>
        </div>
    </header>
    <main>
        <div class="form-heading">
            <h2>Choose your city for better Experience</h2>
        </div>
        <div class="city-form">
            <form action="{{ url_for('city_selection') }}" method="POST">
                <input type="text" id="city" name="city" placeholder="City" required>
                <input type="submit" id="city-submit" value="Search Parking" >
            </form>
        </div>
        <div class="svgs">
            <div class="custom-shape-divider-top-1752734362">
                <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
                </svg>
            </div>
            <div class="custom-shape-divider-bottom-1752734412">
                <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                    <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
                </svg>
            </div>
        </div>
    </main>
{% endblock %}
